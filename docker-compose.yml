# ClickHouse playground: ClickHouse + a local S3 bucket (SeaweedFS) + dbt.
# First time: ./setup.sh   (creates .env, starts everything, loads all datasets)
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: playground
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1   # lets you CREATE USER / ROLE / GRANT
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}           # used by the `lake` named collection
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "${CH_HTTP_PORT:-8123}:8123"   # HTTP: web UI at /play, DBeaver, DataGrip, curl
      - "${CH_TCP_PORT:-9000}:9000"    # native protocol: clickhouse-client
    volumes:
      - ch_data:/var/lib/clickhouse
      - ch_logs:/var/log/clickhouse-server
      - ./init:/docker-entrypoint-initdb.d                                   # runs once, on first start
      - ./config/named_collections.xml:/etc/clickhouse-server/config.d/named_collections.xml:ro
      - ./config/users_named_collections.xml:/etc/clickhouse-server/users.d/named_collections.xml:ro   # generated by setup.sh
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    depends_on:
      - s3

  # S3-compatible object storage, standing in for the project's AWS S3 buckets.
  s3:
    image: chrislusf/seaweedfs:3.80
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=0 -master.volumeSizeLimitMB=256
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - s3_data:/data
      - ./config/s3.json:/etc/seaweedfs/s3.json:ro   # generated by setup.sh from .env

  # dbt with the ClickHouse adapter. Not started by `up`; run it on demand:
  #   docker compose run --rm dbt build
  dbt:
    build: ./dbt
    profiles: ["tools"]
    working_dir: /usr/app/meter_project
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      DBT_PROFILES_DIR: /usr/app/meter_project
    volumes:
      - ./dbt/meter_project:/usr/app/meter_project
    depends_on:
      - clickhouse

volumes:
  ch_data:
  ch_logs:
  s3_data:
